apiVersion: v1
kind: Service
metadata:
  name: pinguin-radio-proxy
  annotations:
    metallb.io/address-pool: doc-example
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: pinguin-radio-proxy
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 5002
